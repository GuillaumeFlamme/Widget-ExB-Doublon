<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Fond gris et bordures style widget original -->
  <rect x="0" y="0" width="100" height="100" fill="#808080" stroke="#000000" stroke-width="2"/>
  <rect x="5" y="5" width="90" height="90" fill="none" stroke="#666666" stroke-width="1"/>
  
  <!-- Ligne classique simple -->
  <line x1="20" y1="75" x2="75" y2="20" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Ligne avec croix -->
  <line x1="38" y1="93" x2="93" y2="38" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Croix le long de la deuxième ligne -->
  <!-- Répétition de motifs de croix rouges comme sur la capture -->
  <g stroke="#E60000" stroke-width="1.5" stroke-linecap="round">
    <!-- Croix 1 -->
    <path d="M 44,85 L 48,89 M 48,85 L 44,89" />
    <!-- Croix 2 -->
    <path d="M 52,77 L 56,81 M 56,77 L 52,81" />
    <!-- Croix 3 -->
    <path d="M 60,69 L 64,73 M 64,69 L 60,73" />
    <!-- Croix 4 -->
    <path d="M 68,61 L 72,65 M 72,61 L 68,65" />
    <!-- Croix 5 -->
    <path d="M 76,53 L 80,57 M 80,53 L 76,57" />
    <!-- Croix 6 -->
    <path d="M 84,45 L 88,49 M 88,45 L 84,49" />
  </g>
</svg>
